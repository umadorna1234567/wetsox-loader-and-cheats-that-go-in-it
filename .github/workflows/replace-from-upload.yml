name: Replace repository from uploaded archive

on:
  push:
    branches: [main]
    paths:
      - '.github/.transfer/payload.b64'
      - '.github/workflows/replace-from-upload.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and extract uploaded project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wetsox-import
          mkdir -p /tmp/wetsox-import
          tr -d '\r\n\t ' < .github/.transfer/payload.b64 | base64 -d > /tmp/wetsox-import.zip
          unzip -q /tmp/wetsox-import.zip -d /tmp/wetsox-import

      - name: Replace repository contents
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/wetsox-import/. .

      - name: Commit replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Replace repository with files from Multi cheat.rar"
          git push origin HEAD:main
